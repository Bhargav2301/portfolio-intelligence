[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "portfolio-intelligence-api"
version = "0.1.0"
description = "Portfolio Intelligence core portfolio and ingestion API"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "xlrd>=2.0,<3"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

