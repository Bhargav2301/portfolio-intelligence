services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio_intelligence
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pi_postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      PI_ENVIRONMENT: development
      PI_DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio_intelligence
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pi_postgres:

