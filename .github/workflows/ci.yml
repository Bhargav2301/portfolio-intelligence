name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, agents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service
        run: pip install -e "services/${{ matrix.service }}[dev]"
      - name: Compile
        run: python -m compileall -q "services/${{ matrix.service }}/src"
      - name: Test
        run: python -m unittest discover -s "services/${{ matrix.service }}/tests" -p "test_*.py" -v

  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:web

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_repository.py

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ephemeral environment
        run: python scripts/bootstrap_env.py
      - name: Build and start stack
        run: docker compose up --detach --build
      - name: Exercise browser-to-agent vertical slice
        shell: bash
        run: |
          curl --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors -fsS http://localhost:8000/health/ready | jq -e '.status == "ready"'
          curl --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors -fsS http://localhost:8001/health/ready | jq -e '.status == "ready"'
          curl --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors -fsS http://localhost:3000 >/dev/null
          portfolio_response=$(curl -fsS -X POST http://localhost:3000/api/core/v1/portfolios \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Portfolio","portfolio_type":"self_managed","base_currency":"INR","benchmark_code":"NIFTY_500_TRI","valuation_timezone":"Asia/Kolkata"}')
          portfolio_id=$(jq -er '.id' <<<"$portfolio_response")
          printf 'date,symbol,quantity\n2026-08-26,TEST.NS,4\n' > /tmp/portfolio-smoke.csv
          curl -fsS -X POST http://localhost:3000/api/core/v1/uploads \
            -F "portfolio_id=$portfolio_id" \
            -F 'source_role=brokerage_ledger' \
            -F 'file=@/tmp/portfolio-smoke.csv;type=text/csv' \
            | jq -e '.state == "review_required" and .authority_level == "ledger_candidate"'
          curl -fsS -X POST http://localhost:3000/api/agents/v1/agent-runs \
            -H 'Content-Type: application/json' \
            -d "{\"portfolio_id\":\"$portfolio_id\",\"question\":\"What should I review first?\"}" \
            | jq -e '.state == "completed" and .policy.decision == "limited"'
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans
