name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: pytest --cov=portfolio_intelligence --cov-report=term-missing
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src

